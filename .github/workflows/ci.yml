name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.compiler.cxx }}, ${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { cc: gcc, cxx: g++ }
          - { cc: clang, cxx: clang++ }
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake
      - name: configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_COMPILER=${{ matrix.compiler.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }}
      - name: build
        run: cmake --build build
      - name: test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: sanitizers (asan+ubsan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake
      - name: configure
        run: >
          cmake -S . -B build-asan -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DLSM_SANITIZE=asan-ubsan
      - name: build
        run: cmake --build build-asan
      - name: test
        run: ctest --test-dir build-asan --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  thread-sanitizer:
    name: sanitizers (thread)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake
      - name: configure
        run: >
          cmake -S . -B build-tsan -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DLSM_SANITIZE=tsan
      - name: build
        run: cmake --build build-tsan
      - name: test
        run: ctest --test-dir build-tsan --output-on-failure
        env:
          TSAN_OPTIONS: halt_on_error=1

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake clang-tidy-18
      - name: configure
        run: >
          cmake -S . -B build-tidy -G Ninja
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DLSM_BUILD_TESTS=OFF
      - name: run clang-tidy
        run: clang-tidy-18 -p build-tidy src/status.cpp src/db.cpp src/db_impl.cpp

  clang-format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: check formatting
        run: >
          find src include tests bench \( -name '*.cpp' -o -name '*.h' \)
          -print0 | xargs -0 clang-format-18 --dry-run --Werror
